<!DOCTYPE html>
<html>
<head>
    <title>Monster Mayhem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Monster Mayhem</h1>

        <p id="connectionMessage">Connecting to server...</p>

        <p>Your Socket ID:</p>
        <p id="socketId">Waiting for ID...</p>

        <h2>Choose a Monster to Place</h2>

        <div class="monster-buttons">
            <button id="vampireButton">Vampire</button>
            <button id="werewolfButton">Werewolf</button>
            <button id="ghostButton">Ghost</button>
        </div>

        <p id="selectedMonsterText">Selected monster to place: None</p>

        <h2>Remaining Monsters</h2>
        <p id="remainingMonstersText">Vampire: 1 | Werewolf: 1 | Ghost: 1</p>

        <h2>Selected Monster to Move</h2>
        <p id="selectedMoveText">Selected monster to move: None</p>

        <h2>Game Board</h2>

        <div id="gameBoard"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

</body>
</html>
